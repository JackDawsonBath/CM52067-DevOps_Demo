name: CI Tests

on: 
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repo
                uses: actions/checkout@v5

            -   name: Setup Python
                uses: actions/setup-python@v6
                with:
                    python-version: '3.11'

            -   name: Install Dependencies
                run: |
                    pip install -r requirements.txt

            -   name: Run tests
                run: |
                    python -m pytest
