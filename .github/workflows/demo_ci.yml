name: CI Tests

on: 
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5 # Updated version

      - name: Build Docker image
        run: docker build -t textstats .

      - name: Run test pipeline
        run: |
          docker run --name report-container \
            -e COMMIT=${{ github.sha }} \
            -e BRANCH=${{ github.ref_name }} \
            -e RUN=${{ github.run_number }} \
            textstats bash -c "
              mkdir -p report &&
              python -m pytest -v > report/test_output.txt || true &&
              bash scripts/build_info.sh &&
              tectonic report/template.tex --outdir report --print --keep-logs &&
              mv report/template.pdf report/report.pdf
            "

      - name: Copy report
        if: always()
        run: |
          docker cp report-container:/app/report/report.pdf report.pdf || echo "PDF not found"
          docker cp report-container:/app/report/template.log report.log || echo "Log not found"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v5 # Updated version
        with:
          name: final-report
          path: |
            report.pdf
            report.log
